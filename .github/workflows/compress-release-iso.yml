name: Compress and Attach ISO to Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow Run ID with the built ISO artifact'
        required: true
        default: '36169019952'
      release_tag:
        description: 'Release tag to attach compressed ISO to'
        required: true
        default: 'v0.2.12'

jobs:
  compress-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@v7
        continue-on-error: true

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          name: orca-${{ inputs.release_tag }}-installer
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./iso-artifact

      - name: Compress with xz and upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Listing downloaded artifact files..."
          ls -la ./iso-artifact

          ISO_SRC=$(find ./iso-artifact -type f -name "*.iso" | head -n 1)
          if [ -z "$ISO_SRC" ]; then
            echo "❌ No ISO file found in downloaded artifact!"
            exit 1
          fi

          TARGET_ISO="orca-${{ inputs.release_tag }}-x86_64.iso"
          echo "Found ISO: $ISO_SRC -> renaming to $TARGET_ISO"
          mv -v "$ISO_SRC" "./$TARGET_ISO"

          echo "🗜️ Compressing with xz -T0 -3..."
          xz -T0 -3 -v "./$TARGET_ISO"

          echo "Generating SHA256 checksum..."
          sha256sum "./${TARGET_ISO}.xz" > "./${TARGET_ISO}.xz-CHECKSUM"

          echo "Uploading to GitHub Release ${{ inputs.release_tag }}..."
          gh release upload "${{ inputs.release_tag }}" "./${TARGET_ISO}.xz" "./${TARGET_ISO}.xz-CHECKSUM" --repo "${{ github.repository }}" --clobber

          echo "✅ Successfully uploaded compressed ISO and checksum to release ${{ inputs.release_tag }}!"
