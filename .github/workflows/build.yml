name: Build and Push Orca Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # Weekly rebuild for security patches

env:
  IMAGE_NAME: "orca"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@v7
        continue-on-error: true

      - name: Set lowercased variables
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Determine image tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            CLEAN_VERSION="${VERSION#v}"
            MAJOR_MINOR=$(echo "$CLEAN_VERSION" | cut -d. -f1,2)
            {
              echo "tags<<EOF"
              echo "${VERSION}"
              echo "${CLEAN_VERSION}"
              echo "v${MAJOR_MINOR}"
              echo "${MAJOR_MINOR}"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          else
            {
              echo "tags<<EOF"
              echo "latest"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Build image using buildah
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.tags.outputs.tags }}
          containerfiles: |
            ./Containerfile
          oci: true

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
