name: Build and Push Orca Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # Weekly rebuild for security patches

env:
  IMAGE_NAME: "orca"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        flavor: [standard, nvidia]
        include:
          - flavor: standard
            base_image: "ghcr.io/ublue-os/bluefin:stable"
            image_name_suffix: ""
            tag_suffix: ""
          - flavor: nvidia
            base_image: "ghcr.io/ublue-os/bluefin-nvidia:stable"
            image_name_suffix: ""
            tag_suffix: "-nvidia"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@v7
        continue-on-error: true

      - name: Set lowercased variables
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Determine image tags
        id: tags
        run: |
          SUFFIX="${{ matrix.tag_suffix }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            CLEAN_VERSION="${VERSION#v}"
            MAJOR_MINOR=$(echo "$CLEAN_VERSION" | cut -d. -f1,2)
            {
              echo "tags<<EOF"
              echo "${VERSION}${SUFFIX}"
              echo "${CLEAN_VERSION}${SUFFIX}"
              echo "v${MAJOR_MINOR}${SUFFIX}"
              echo "${MAJOR_MINOR}${SUFFIX}"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          else
            {
              echo "tags<<EOF"
              echo "latest${SUFFIX}"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Build image using buildah
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
          containerfiles: |
            ./Containerfile
          oci: true

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}

      - name: Trigger ISO Build for Release Tag (Standard)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.flavor == 'standard'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "🚀 Standard image pushed! Triggering ISO build workflow for release tag: $VERSION..."
          gh workflow run build-iso.yml -f image_tag="$VERSION"

