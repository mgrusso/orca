name: Build and Push Orca Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # Weekly rebuild for security patches

env:
  IMAGE_NAME: "orca"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@v7
        continue-on-error: true

      - name: Set lowercased variables
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Determine image tags and version
        id: tags
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            CLEAN_VERSION="${VERSION#v}"
            MAJOR_MINOR=$(echo "$CLEAN_VERSION" | cut -d. -f1,2 | cut -d- -f1)
            echo "orca_version=${VERSION}" >> $GITHUB_OUTPUT
            
            # Check if this is a pre-release (contains -rc, -beta, -alpha)
            if [[ "${VERSION}" =~ -(rc|beta|alpha) ]]; then
              echo "is_prerelease=true" >> $GITHUB_OUTPUT
              PRE_KIND=$(echo "${VERSION}" | sed -E 's/.*-(rc|beta|alpha).*/\1/')
              {
                echo "tags<<EOF"
                echo "${VERSION}"
                echo "${CLEAN_VERSION}"
                echo "v${MAJOR_MINOR}-${PRE_KIND}"
                echo "${MAJOR_MINOR}-${PRE_KIND}"
                echo "EOF"
              } >> $GITHUB_OUTPUT
            else
              echo "is_prerelease=false" >> $GITHUB_OUTPUT
              {
                echo "tags<<EOF"
                echo "${VERSION}"
                echo "${CLEAN_VERSION}"
                echo "v${MAJOR_MINOR}"
                echo "${MAJOR_MINOR}"
                echo "EOF"
              } >> $GITHUB_OUTPUT
            fi
          else
            echo "orca_version=latest-${SHA_SHORT}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            {
              echo "tags<<EOF"
              echo "latest"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Build image using buildah
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            ORCA_VERSION=${{ steps.tags.outputs.orca_version }}
          containerfiles: |
            ./Containerfile
          oci: true

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}

      - name: Trigger ISO Build for Stable Release Tag
        if: startsWith(github.ref, 'refs/tags/v') && steps.tags.outputs.is_prerelease == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "🚀 Stable release image pushed! Triggering ISO build workflow for: $VERSION..."
          gh workflow run build-iso.yml -f image_tag="$VERSION"

