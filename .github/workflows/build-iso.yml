name: Build Orca ISO Installer

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to package into the ISO (e.g. v0.2, v0.2.6, latest)'
        required: true
        default: 'v0.2'
      fedora_version:
        description: 'Base Fedora version'
        required: true
        default: '41'

env:
  IMAGE_NAME: "orca"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@v7
        continue-on-error: true

      - name: Set lowercased variables
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Build bootable ISO installer
        id: build-iso
        uses: jasonn3/build-container-installer@main
        with:
          arch: x86_64
          image_name: ${{ env.IMAGE_NAME }}
          image_repo: ${{ env.IMAGE_REGISTRY }}
          image_tag: ${{ inputs.image_tag }}
          version: ${{ inputs.fedora_version }}
          variant: Silverblue
          iso_name: orca-${{ inputs.image_tag }}-x86_64.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orca-${{ inputs.image_tag }}-installer
          path: |
            ${{ steps.build-iso.outputs.iso_path }}
            ${{ steps.build-iso.outputs.iso_path }}-CHECKSUM
          if-no-files-found: error
          retention-days: 14
