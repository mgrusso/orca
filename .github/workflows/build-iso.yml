name: Build Orca ISO Installer

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to package into the ISO (e.g. v0.2, v0.2.10, latest)'
        required: true
        default: 'v0.2'

env:
  IMAGE_NAME: "orca"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@v7
        continue-on-error: true

      - name: Set lowercased variables
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create bootc-image-builder configuration
        run: |
          mkdir -p output
          cat << 'EOF' > config.toml
          [customizations.installer.kickstart]
          contents = ""
          EOF

      - name: Build bootable ISO installer via bootc-image-builder
        run: |
          FULL_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${{ inputs.image_tag }}"
          echo "Building bootable ISO for: $FULL_IMAGE"

          echo "Pulling image into local container storage..."
          sudo podman pull "$FULL_IMAGE"

          sudo podman run \
            --rm \
            --privileged \
            --pull=newer \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$PWD/config.toml:/config.toml:ro" \
            -v "$PWD/output:/output" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --rootfs btrfs \
            --config /config.toml \
            "$FULL_IMAGE"



      - name: Prepare ISO artifact
        id: prepare-iso
        run: |
          ISO_SRC=$(find output/ -type f \( -name "*.iso" -o -name "install.iso" -o -name "boot.iso" \) | head -n 1)
          if [ -z "$ISO_SRC" ] || [ ! -f "$ISO_SRC" ]; then
            echo "❌ Error: No ISO file generated in output directory!"
            ls -laR output/
            exit 1
          fi

          TARGET_ISO="orca-${{ inputs.image_tag }}-x86_64.iso"
          mv -v "$ISO_SRC" "./$TARGET_ISO"
          sha256sum "./$TARGET_ISO" > "./${TARGET_ISO}-CHECKSUM"

          echo "iso_path=./$TARGET_ISO" >> $GITHUB_OUTPUT
          echo "checksum_path=./${TARGET_ISO}-CHECKSUM" >> $GITHUB_OUTPUT
          echo "iso_filename=$TARGET_ISO" >> $GITHUB_OUTPUT

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orca-${{ inputs.image_tag }}-installer
          path: |
            ${{ steps.prepare-iso.outputs.iso_path }}
            ${{ steps.prepare-iso.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload ISO to GitHub Release
        if: startsWith(inputs.image_tag, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.image_tag }}" "${{ steps.prepare-iso.outputs.iso_path }}" "${{ steps.prepare-iso.outputs.checksum_path }}" --clobber || true
