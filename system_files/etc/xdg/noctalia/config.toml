# Orca Default Noctalia Shell Configuration
# Matches Ghostty & Niri (Deep Ocean / Catppuccin Mocha aesthetic)

[general]
theme = "dark"
font = "Inter 11"
icon_theme = "Papirus-Dark"

[shell]
setup_wizard_enabled = false

[wallpaper]
enabled = true
directory = "/usr/share/backgrounds/bluefin"
directory_dark = "/usr/share/backgrounds/bluefin"
fill_mode = "crop"

[wallpaper.default]
path = "/usr/share/backgrounds/bluefin/bluefin_night.jxl"

[bar.top]
position = "top"
thickness = 36
background_opacity = 0.93
radius = 12
start = ["launcher", "wallpaper", "workspaces"]
center = ["clock"]
end = ["media", "power_profile", "network", "battery", "control_center_toggle"]

[launcher]
icon = "distributor-logo-fedora"
command = "noctalia msg panel-toggle launcher"

[power_profile]
# Native power-profiles-daemon integration
enabled = true

[battery]
show_percentage = true
warning_level = 20
critical_level = 10

[clock]
format = "%a %d. %b  %H:%M"

[control_center]
enabled = true
blur = true
border_radius = 16
modules = ["quick_settings", "brightness", "volume", "power_profiles", "notifications"]
