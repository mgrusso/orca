general {
    lock_cmd = orca-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = niri msg action power-on-monitors 2>/dev/null || hyprctl dispatch dpms on 2>/dev/null || true
}

# Dim screen after 3 minutes of inactivity
listener {
    timeout = 180
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

# Lock screen after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off display backlight after 10 minutes
listener {
    timeout = 600
    on-timeout = niri msg action power-off-monitors 2>/dev/null || hyprctl dispatch dpms off 2>/dev/null || true
    on-resume = niri msg action power-on-monitors 2>/dev/null || hyprctl dispatch dpms on 2>/dev/null || true
}

# Suspend after 20 minutes
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
