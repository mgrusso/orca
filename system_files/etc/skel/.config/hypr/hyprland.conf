# Orca Default Hyprland Configuration
# Modern Dynamic Tiling with Noctalia Shell & Ghostty integration

# Autostart
exec-once = /usr/local/libexec/polkit-mate-authentication-agent-1
exec-once = noctalia

# Input configuration
input {
    kb_layout = de
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(cba6f7ee) rgba(89b4faee) 45deg
    col.inactive_border = rgba(313244aa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

$mainMod = SUPER

# Applications & Dakota parity
bind = $mainMod, Return, exec, ghostty
bind = $mainMod, T, exec, ghostty
bind = $mainMod, SPACE, exec, noctalia msg panel-toggle launcher
bind = $mainMod, D, exec, noctalia msg panel-toggle launcher
bind = $mainMod, C, exec, noctalia msg panel-toggle control-center
bind = $mainMod, N, exec, noctalia msg panel-toggle control-center
bind = $mainMod, W, exec, noctalia msg panel-toggle wallpaper
bind = $mainMod SHIFT, W, exec, noctalia msg wallpaper-random
bind = $mainMod, B, exec, firefox
bind = $mainMod, E, exec, nautilus
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod, F, fullscreen, 0

# Focus navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Media keys
bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Ghostty terminal opacity rules
windowrule = opacity 0.82 0.82,^(com.mitchellh.ghostty)$
windowrule = opacity 0.82 0.82,^(ghostty)$
